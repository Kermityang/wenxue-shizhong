name: build

# 只做「能不能编译」的体检。这里刻意不给写权限：
# Release 里的 APK 一律由维护者用固定证书在本机构建后上传，
# CI 现场生成的临时证书签的包绝不能发出去（换了证书无法覆盖升级）。
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']      # 打 tag 只多验一次构建，不发 Release
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 镜像预装了 Android SDK，直接用，不必再装
      - name: 确认 SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true

      # 仅用于本 artifact（体检产物，无字体、不是发布包）
      - name: 生成临时签名
        run: |
          keytool -genkeypair -keystore release.jks -alias clock \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass etasign -keypass etasign -dname "CN=clock"

      - name: 构建
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: clock-apk
          path: clock.apk
          if-no-files-found: error
