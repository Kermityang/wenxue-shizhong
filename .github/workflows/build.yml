name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 镜像预装了 Android SDK，直接用，不必再装
      - name: 确认 SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: 生成临时签名
        run: |
          keytool -genkeypair -keystore release.jks -alias clock \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass etasign -keypass etasign -dname "CN=clock"

      - name: 构建
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: clock-apk
          path: clock.apk
          if-no-files-found: error

  # 打 tag 时把 APK 传到 Release（只在有 RELEASE_TOKEN 时生效）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clock-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: clock.apk
